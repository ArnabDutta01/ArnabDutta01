name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"      # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-commit
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Classic personal access token with no scopes ticked, saved as a repo secret.
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          committer_message: "chore: update metrics"

          base: header, activity, community, repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 6

          # Org logos of repos where your commits landed on the default branch (i.e. merged PRs).
          plugin_notable: yes
          plugin_notable_skipped: firstcontributions/first-contributions

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
